<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mental Math: Whole Number Division</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1d2939;background:#f3f7fb}*{box-sizing:border-box}body{margin:0;padding:24px 12px}.wrap{max-width:680px;margin:auto;background:white;border-radius:20px;padding:clamp(20px,5vw,38px);box-shadow:0 8px 35px #243b5320}h1{font-size:clamp(24px,5vw,33px);line-height:1.18;margin:0 0 12px;color:#173c67}.sub{color:#586579;margin-bottom:26px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:650;color:#315b84}.bar{height:10px;background:#e6edf5;border-radius:20px;margin:14px 0 30px;overflow:hidden}.fill{height:100%;background:#2b7bbb;width:0%;transition:width .25s}.problem{text-align:center;font-size:clamp(34px,9vw,58px);font-weight:750;margin:20px 0 28px}label{display:block;font-weight:650;margin-bottom:9px}input{width:100%;font-size:26px;padding:15px;border:2px solid #a7b9ca;border-radius:12px}input:focus{outline:3px solid #b3ddff;border-color:#2674b7}button{cursor:pointer;border:0;background:#1765a5;color:white;padding:15px 24px;border-radius:12px;font-size:17px;font-weight:700;margin-top:17px}button:hover{background:#124f82}button:disabled{background:#9cabb8;cursor:default}.feedback{font-weight:700;margin-top:18px;min-height:30px}.good{color:#167345}.bad{color:#b42318}.hide{display:none}.end{text-align:center}.end strong{font-size:50px;color:#1765a5}.note{font-size:14px;color:#68788b;margin-top:20px}</style></head><body><main class="wrap"><h1>Mental Math: Whole Number Division</h1><p class="sub">Practice dividing friendly whole numbers in your head. No calculator needed!</p><section id="quiz"><div class="top"><span id="counter">Question 1 of 10</span><span id="score">Correct: 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="problem" id="problem"></div><form id="form"><label for="answer">Your answer</label><input id="answer" type="number" step="1" inputmode="numeric" required autocomplete="off" placeholder="Enter a whole number"><button type="submit" id="check">Check Answer</button></form><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="next" class="hide" type="button">Next Question →</button></section><section id="results" class="end hide" aria-live="polite"><h2>Round Complete!</h2><p><strong id="final"></strong></p><p id="message"></p><button id="again">Try 10 New Questions</button></section><p class="note">Each round randomly selects 10 different questions from a bank of 75. Answers are graded immediately.</p></main><script>
const BANK=[{"a": 9000, "b": 3, "answer": 3000}, {"a": 120, "b": 4, "answer": 30}, {"a": 600, "b": 3, "answer": 200}, {"a": 480, "b": 6, "answer": 80}, {"a": 7200, "b": 8, "answer": 900}, {"a": 560, "b": 7, "answer": 80}, {"a": 2000, "b": 20, "answer": 100}, {"a": 100, "b": 10, "answer": 10}, {"a": 1000, "b": 20, "answer": 50}, {"a": 7500, "b": 5, "answer": 1500}, {"a": 2400, "b": 4, "answer": 600}, {"a": 7500, "b": 25, "answer": 300}, {"a": 480, "b": 4, "answer": 120}, {"a": 200, "b": 5, "answer": 40}, {"a": 800, "b": 4, "answer": 200}, {"a": 4000, "b": 8, "answer": 500}, {"a": 200, "b": 20, "answer": 10}, {"a": 16000, "b": 8, "answer": 2000}, {"a": 1600, "b": 2, "answer": 800}, {"a": 450, "b": 3, "answer": 150}, {"a": 12000, "b": 10, "answer": 1200}, {"a": 200, "b": 8, "answer": 25}, {"a": 40, "b": 2, "answer": 20}, {"a": 720, "b": 8, "answer": 90}, {"a": 2400, "b": 2, "answer": 1200}, {"a": 4800, "b": 8, "answer": 600}, {"a": 810, "b": 9, "answer": 90}, {"a": 6300, "b": 9, "answer": 700}, {"a": 500, "b": 5, "answer": 100}, {"a": 80, "b": 4, "answer": 20}, {"a": 9000, "b": 9, "answer": 1000}, {"a": 1800, "b": 3, "answer": 600}, {"a": 20, "b": 2, "answer": 10}, {"a": 2400, "b": 12, "answer": 200}, {"a": 4200, "b": 7, "answer": 600}, {"a": 3600, "b": 3, "answer": 1200}, {"a": 180, "b": 3, "answer": 60}, {"a": 90, "b": 6, "answer": 15}, {"a": 500, "b": 25, "answer": 20}, {"a": 50000, "b": 25, "answer": 2000}, {"a": 120, "b": 8, "answer": 15}, {"a": 3750, "b": 25, "answer": 150}, {"a": 450, "b": 15, "answer": 30}, {"a": 10000, "b": 10, "answer": 1000}, {"a": 1500, "b": 25, "answer": 60}, {"a": 2500, "b": 10, "answer": 250}, {"a": 15000, "b": 25, "answer": 600}, {"a": 800, "b": 8, "answer": 100}, {"a": 6400, "b": 8, "answer": 800}, {"a": 600, "b": 5, "answer": 120}, {"a": 7200, "b": 6, "answer": 1200}, {"a": 20000, "b": 25, "answer": 800}, {"a": 20000, "b": 20, "answer": 1000}, {"a": 1000, "b": 25, "answer": 40}, {"a": 900, "b": 9, "answer": 100}, {"a": 100, "b": 5, "answer": 20}, {"a": 7000, "b": 10, "answer": 700}, {"a": 5000, "b": 25, "answer": 200}, {"a": 320, "b": 8, "answer": 40}, {"a": 160, "b": 4, "answer": 40}, {"a": 60, "b": 4, "answer": 15}, {"a": 30000, "b": 15, "answer": 2000}, {"a": 180, "b": 9, "answer": 20}, {"a": 30000, "b": 10, "answer": 3000}, {"a": 30, "b": 2, "answer": 15}, {"a": 30000, "b": 25, "answer": 1200}, {"a": 900, "b": 15, "answer": 60}, {"a": 1200, "b": 15, "answer": 80}, {"a": 1200, "b": 10, "answer": 120}, {"a": 2500, "b": 5, "answer": 500}, {"a": 1000, "b": 10, "answer": 100}, {"a": 18000, "b": 12, "answer": 1500}, {"a": 6250, "b": 25, "answer": 250}, {"a": 4000, "b": 20, "answer": 200}, {"a": 10500, "b": 15, "answer": 700}];
let round=[],index=0,correct=0,checked=false,previous=[];
const el=id=>document.getElementById(id);
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){let candidates=shuffle(BANK.map((_,i)=>i).filter(i=>!previous.includes(i)));if(candidates.length<10)candidates=shuffle(BANK.map((_,i)=>i));previous=candidates.slice(0,10);round=previous.map(i=>BANK[i]);index=0;correct=0;el('quiz').classList.remove('hide');el('results').classList.add('hide');show()}
function show(){checked=false;const q=round[index];el('counter').textContent=`Question ${index+1} of 10`;el('score').textContent=`Correct: ${correct}`;el('fill').style.width=`${index*10}%`;el('problem').textContent=`${q.a.toLocaleString('en-US')} ÷ ${q.b.toLocaleString('en-US')} = ?`;el('answer').value='';el('answer').disabled=false;el('check').disabled=false;el('form').classList.remove('hide');el('feedback').textContent='';el('feedback').className='feedback';el('next').classList.add('hide');el('next').textContent=index===9?'See My Score →':'Next Question →';el('answer').focus()}
el('form').addEventListener('submit',e=>{e.preventDefault();if(checked)return;const value=el('answer').value.trim();if(!value)return;checked=true;const q=round[index],isRight=Number(value)===q.answer;if(isRight)correct++;el('feedback').textContent=isRight?'✓ Correct! Great job!':`✗ Not quite. The correct answer is ${q.answer.toLocaleString('en-US')}.`;el('feedback').classList.add(isRight?'good':'bad');el('score').textContent=`Correct: ${correct}`;el('answer').disabled=true;el('check').disabled=true;el('next').classList.remove('hide')});
el('next').addEventListener('click',()=>{index++;if(index===10){el('quiz').classList.add('hide');el('results').classList.remove('hide');el('final').textContent=`${correct} / 10 (${correct*10}%)`;el('message').textContent=correct===10?'Perfect score!':correct>=8?'Great work! Keep practicing.':'Keep practicing—you can try another set!'}else show()});el('again').addEventListener('click',start);start();
</script></body></html>
