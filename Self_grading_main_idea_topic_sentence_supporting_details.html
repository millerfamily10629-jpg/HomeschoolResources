<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Main Idea Practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f1e9;color:#222}
.wrap{max-width:800px;margin:auto;padding:18px 14px 32px}
h1{text-align:center;color:#365f7d;margin:4px 0 8px;font-size:clamp(2rem,7vw,2.8rem)}
.card{background:#fff;border:1px solid #d8d2c9;border-radius:20px;padding:20px;box-shadow:0 8px 24px #0001}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;color:#555}
.badge{background:#ece7f1;color:#6c5b7b;border-radius:999px;padding:6px 10px;font-weight:800;font-size:.85rem}
.bar{height:10px;background:#e6e2dc;border-radius:99px;overflow:hidden;margin:14px 0}
.fill{height:100%;background:#6c5b7b;width:0}
.q{font-size:1.2rem;line-height:1.5;font-weight:700;margin:18px 0}
.choices{display:grid;gap:10px}
.choice{width:100%;text-align:left;border:2px solid #d4d4d4;background:#fff;color:#222;border-radius:14px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer}
.correct{border-color:#2f7d4a!important;background:#edf8f0!important}
.wrong{border-color:#a43f3f!important;background:#fbeeee!important}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;line-height:1.4}
.good{display:block;background:#edf8f0;color:#1f5f36}
.bad{display:block;background:#fbeeee;color:#7d2d2d}
.next,.restart{width:100%;border:0;border-radius:14px;padding:14px 16px;margin-top:14px;background:#365f7d;color:#fff;font:inherit;font-weight:800;cursor:pointer}
.next{display:none}
.result{text-align:center;display:none}
.score{font-size:3rem;font-weight:900;color:#365f7d;margin:10px 0}
.note{background:#f7f4ec;border:1px solid #ddd3c2;border-radius:14px;padding:12px;margin-top:14px;line-height:1.4}
.footer{text-align:center;color:#777;font-size:.8rem;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>Topic Sentence, Main Idea & Supporting Details</h1>

<div class="card" id="quiz">
  <div class="top">
    <span id="counter"></span>
    <span class="badge" id="type"></span>
  </div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="q" id="q"></div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="fb"></div>
  <button class="next" id="next">Next Question</button>
</div>

<div class="card result" id="result">
  <span class="badge">COMPLETE</span>
  <h2>Final Score</h2>
  <div class="score" id="score"></div>
  <p id="msg"></p>
  <div class="note"><b>Student:</b> Take a screenshot of this page and submit it to your teacher if requested.</div>
  <button class="restart" id="restart">Try Another Random Set</button>
</div>

<div class="footer">Self-Grading ELA Practice • J. Miller</div>
</div>

<script>
const bank=[{"type": "Topic Sentence", "q": "Which sentence is the best topic sentence for a paragraph about why school gardens are useful?", "choices": ["School gardens can benefit students in several important ways.", "Tomatoes can grow in warm weather.", "Some students like carrots.", "The garden has a wooden fence."], "answer": "School gardens can benefit students in several important ways.", "explanation": "A topic sentence introduces the main point of the entire paragraph."}, {"type": "Topic Sentence", "q": "Which sentence is the best topic sentence for a paragraph about preparing for a hurricane?", "choices": ["Families should take several steps to prepare for a hurricane.", "Bottled water comes in many sizes.", "Some storms have strong winds.", "Flashlights use batteries."], "answer": "Families should take several steps to prepare for a hurricane.", "explanation": "It introduces the overall topic and can be supported by several details."}, {"type": "Topic Sentence", "q": "Which sentence is the best topic sentence for a paragraph about reading every day?", "choices": ["Reading every day can improve several important skills.", "Libraries have many shelves.", "Some books are very long.", "Mystery books often have clues."], "answer": "Reading every day can improve several important skills.", "explanation": "It states the broad idea that the rest of the paragraph could explain."}, {"type": "Topic Sentence", "q": "Which sentence is the best topic sentence for a paragraph about exercise?", "choices": ["Regular exercise helps the body and mind in many ways.", "Running shoes come in many colors.", "Gyms often have mirrors.", "Some people prefer walking."], "answer": "Regular exercise helps the body and mind in many ways.", "explanation": "A good topic sentence gives the main focus of the paragraph."}, {"type": "Topic Sentence", "q": "Which sentence is the best topic sentence for a paragraph about teamwork?", "choices": ["Strong teamwork can help groups solve problems more effectively.", "Some teams wear matching shirts.", "People sometimes work in groups.", "Meetings can happen in classrooms."], "answer": "Strong teamwork can help groups solve problems more effectively.", "explanation": "It introduces a central idea that supporting details can explain."}, {"type": "Main Idea", "q": "Read the paragraph:<br><br>Bees help many plants reproduce by carrying pollen from flower to flower. Without bees, many fruits and vegetables would be harder to grow. Farmers and gardeners depend on pollinators to help crops produce food.<br><br>What is the main idea?", "choices": ["Bees are important because they help plants reproduce and crops grow.", "Bees live near gardens.", "Farmers grow fruits and vegetables.", "Pollen is found in flowers."], "answer": "Bees are important because they help plants reproduce and crops grow.", "explanation": "The main idea summarizes what all the details are mostly about."}, {"type": "Main Idea", "q": "Read the paragraph:<br><br>Many students benefit from getting enough sleep. Sleep helps the brain focus, remember information, and manage emotions. Students who are well rested may also have more energy during the school day.<br><br>What is the main idea?", "choices": ["Getting enough sleep helps students function better.", "Students sometimes feel tired.", "The brain stores information.", "School days require energy."], "answer": "Getting enough sleep helps students function better.", "explanation": "All of the details explain benefits of sufficient sleep."}, {"type": "Main Idea", "q": "Read the paragraph:<br><br>Recycling can reduce the amount of trash sent to landfills. It can also save raw materials and reduce the energy needed to make new products. Communities often collect paper, plastic, glass, and metal for recycling.<br><br>What is the main idea?", "choices": ["Recycling helps reduce waste and conserve resources.", "Glass can be recycled.", "Landfills contain trash.", "Communities collect materials."], "answer": "Recycling helps reduce waste and conserve resources.", "explanation": "That choice covers the overall point of the paragraph."}, {"type": "Main Idea", "q": "Read the paragraph:<br><br>Volcanoes can change Earth's surface quickly. Lava can create new land, while ash can cover large areas. Over time, volcanic material can even help create rich soil.<br><br>What is the main idea?", "choices": ["Volcanoes can change the land in several ways.", "Lava is hot.", "Ash can fall from the sky.", "Soil can be rich."], "answer": "Volcanoes can change the land in several ways.", "explanation": "The details all describe different ways volcanoes affect land."}, {"type": "Main Idea", "q": "Read the paragraph:<br><br>Public libraries provide more than books. Many offer computers, study spaces, classes, research help, and community events. These services make libraries useful resources for people of all ages.<br><br>What is the main idea?", "choices": ["Libraries provide many useful services to the community.", "Libraries have books.", "Computers are used for research.", "Community events can be fun."], "answer": "Libraries provide many useful services to the community.", "explanation": "This answer includes the whole paragraph, not just one detail."}, {"type": "Supporting Detail", "q": "Topic sentence: <b>Dogs can be helpful companions.</b><br><br>Which sentence is the best supporting detail?", "choices": ["Some dogs are trained to guide people who are visually impaired.", "Dogs have four legs.", "Many dogs have tails.", "Some dogs are brown."], "answer": "Some dogs are trained to guide people who are visually impaired.", "explanation": "This detail directly supports the idea that dogs can be helpful companions."}, {"type": "Supporting Detail", "q": "Topic sentence: <b>Drinking water is important for the body.</b><br><br>Which sentence is the best supporting detail?", "choices": ["Water helps the body stay hydrated and regulate temperature.", "Water bottles can be plastic or metal.", "Some people drink water with ice.", "Rain is made of water."], "answer": "Water helps the body stay hydrated and regulate temperature.", "explanation": "It explains why drinking water is important."}, {"type": "Supporting Detail", "q": "Topic sentence: <b>School clubs can help students build new skills.</b><br><br>Which sentence is the best supporting detail?", "choices": ["A journalism club can help students practice interviewing and writing.", "Clubs often meet after school.", "Some schools have hallways.", "Students carry backpacks."], "answer": "A journalism club can help students practice interviewing and writing.", "explanation": "This example directly supports the idea of skill building."}, {"type": "Supporting Detail", "q": "Topic sentence: <b>Forests are important ecosystems.</b><br><br>Which sentence is the best supporting detail?", "choices": ["Forests provide habitats for many plants and animals.", "Some trees are tall.", "Leaves can be green.", "Forests have paths."], "answer": "Forests provide habitats for many plants and animals.", "explanation": "It explains one reason forests are important ecosystems."}, {"type": "Supporting Detail", "q": "Topic sentence: <b>Planning ahead can reduce stress.</b><br><br>Which sentence is the best supporting detail?", "choices": ["Using a schedule can help people finish tasks before deadlines.", "Calendars have dates.", "Some people use pencils.", "Clocks show time."], "answer": "Using a schedule can help people finish tasks before deadlines.", "explanation": "This detail explains how planning ahead can reduce stress."}, {"type": "Supporting Detail", "q": "Which sentence does <b>NOT</b> support the main idea that bicycles are useful for transportation?", "choices": ["Bicycles do not require gasoline.", "Riding a bicycle can help people travel short distances.", "Bicycles can reduce traffic in crowded areas.", "Some bicycles are painted bright colors."], "answer": "Some bicycles are painted bright colors.", "explanation": "The color of a bicycle does not explain why it is useful for transportation."}, {"type": "Supporting Detail", "q": "Which sentence does <b>NOT</b> support the main idea that school uniforms can simplify mornings?", "choices": ["Students spend less time deciding what to wear.", "Families may have fewer outfit choices to plan.", "Uniforms can make getting dressed more predictable.", "Some uniforms include school logos."], "answer": "Some uniforms include school logos.", "explanation": "A logo does not explain how uniforms simplify mornings."}, {"type": "Supporting Detail", "q": "Which sentence does <b>NOT</b> support the main idea that exercise can improve health?", "choices": ["Exercise can strengthen muscles.", "Exercise can improve heart health.", "Exercise can increase endurance.", "Some gyms play music."], "answer": "Some gyms play music.", "explanation": "Gym music does not support the health benefits of exercise."}, {"type": "Supporting Detail", "q": "Which sentence does <b>NOT</b> support the main idea that reading can expand knowledge?", "choices": ["Books can teach readers about history.", "Articles can explain scientific ideas.", "Biographies can introduce readers to important people.", "Some books have colorful covers."], "answer": "Some books have colorful covers.", "explanation": "The cover color does not explain how reading expands knowledge."}, {"type": "Supporting Detail", "q": "Which sentence does <b>NOT</b> support the main idea that volunteering can help a community?", "choices": ["Volunteers can collect food for families in need.", "Volunteers can clean parks and public spaces.", "Volunteers can help at local events.", "Some volunteers wear matching shirts."], "answer": "Some volunteers wear matching shirts.", "explanation": "Matching shirts do not explain how volunteering helps the community."}], N=10;
let quiz=[],i=0,score=0,answered=false;

function sh(a){a=[...a];for(let x=a.length-1;x>0;x--){let j=Math.floor(Math.random()*(x+1));[a[x],a[j]]=[a[j],a[x]]}return a}
function start(){quiz=sh(bank).slice(0,N).map(x=>({...x,choices:sh(x.choices)}));i=0;score=0;document.getElementById('quiz').style.display='block';document.getElementById('result').style.display='none';show()}
function show(){answered=false;let x=quiz[i];counter.textContent=`Question ${i+1} of ${N}`;type.textContent=x.type;fill.style.width=`${i/N*100}%`;q.innerHTML=x.q;choices.innerHTML='';x.choices.forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>pick(b,c);choices.appendChild(b)});fb.className='feedback';fb.innerHTML='';next.style.display='none'}
function pick(btn,c){if(answered)return;answered=true;let x=quiz[i];document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===x.answer)b.classList.add('correct')});if(c===x.answer){score++;btn.classList.add('correct');fb.className='feedback good';fb.innerHTML='<b>Correct!</b> '+x.explanation}else{btn.classList.add('wrong');fb.className='feedback bad';fb.innerHTML=`<b>Not quite.</b> Correct answer: <b>${x.answer}</b><br>${x.explanation}`}next.textContent=i===N-1?'See My Score':'Next Question';next.style.display='block'}
next.onclick=()=>{if(i<N-1){i++;show()}else finish()};
function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let p=Math.round(score/N*100);document.getElementById('score').textContent=`${score} / ${N} (${p}%)`;document.getElementById('msg').textContent=p===100?'Excellent work — perfect score!':p>=80?'Strong work. Review any questions you missed.':p>=70?'Good effort. Read the feedback and try another set.':'Keep practicing. Focus on what the whole paragraph is mostly about.';window.scrollTo({top:0,behavior:'smooth'})}
restart.onclick=start;start();
</script>
</body>
</html>
